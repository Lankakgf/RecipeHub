{% extends 'base.html' %}

{% block title %}Login | RecipeHub{% endblock %}

{% block content %}

<div class="form-card">

    <h1>Welcome Back!</h1>
    <p>Login to manage your favourite recipes.</p>

    <form method="POST">
        {% csrf_token %}

        {{ form.as_p }}

        {% if form.errors %}
            <p class="error-message">
                Invalid username or password.
            </p>
        {% endif %}

        <button type="submit" class="btn">
            Login
        </button>

    </form>

</div>

{% endblock %}
