
{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}RecipeHub{% endblock %}</title>

    <!-- RecipeHub Custom CSS -->
    <link rel="stylesheet" href="{% static 'recipes/css/style.css' %}">

    {% block extra_css %}{% endblock %}
</head>

<body>

    <!-- Navigation Bar -->
    <nav class="navbar">
     <a href="{% url 'menu' %}">Food Menu</a>
        <a href="{% url 'home' %}" class="logo">
            Recipe<span>Hub.</span>
        </a>

        <div class="nav-links">

            <a href="{% url 'home' %}">Home</a>

            {% if user.is_authenticated %}

                <a href="{% url 'create_recipe' %}">Add Recipe</a>

                <form action="{% url 'logout' %}" method="post">
                    {% csrf_token %}
                    <button class="btn" type="submit">
                        Logout
                    </button>
                </form>

            {% else %}

                <a href="{% url 'login' %}">Login</a>

            {% endif %}

        </div>
    </nav>

    <!-- Main Content -->
    <main class="container">

        {% block content %}
        {% endblock %}

    </main>

    <!-- Footer -->
    <footer>
        <p>© 2026 RecipeHub. Made with ❤️ for food lovers.</p>
    </footer>

</body>
</html>
